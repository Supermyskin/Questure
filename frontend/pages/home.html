<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questure - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/home.css">
    <script src="https://kit.fontawesome.com/1424a6b21b.js" crossorigin="anonymous"></script>
    <script src="../js/auth-guard.js"></script>
    <link rel="icon" href="../favicon.png">
</head>

<body>
    <div class="glow-blob glow-blob-2"></div>
    <div class="glow-blob glow-blob-3"></div>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-text">Questure</span>
                <span class="logo-sub">Side quests worth doing</span>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-section-label">// MAIN</span>
                <a href="#" class="nav-item active">
                    <span class="nav-icon">🏠</span> Home
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">🧭</span> Discover
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⚡</span> My Quests
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">🗺️</span> Map View
                </a>

                <span class="nav-section-label">// SOCIAL</span>
                <a href="#" class="nav-item">
                    <span class="nav-icon">👥</span> Squad
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">🏆</span> Leaderboard
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">📸</span> Gallery
                </a>

                <span class="nav-section-label">// YOU</span>
                <a href="#" class="nav-item">
                    <span class="nav-icon">👤</span> Profile
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙️</span> Settings
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="profile-row">
                    <div class="profile-avatar">🥹</div>
                    <div class="profile-info">
                        <div id="profile-name" class="profile-name">User</div>
                        <div class="profile-rank" id="profile-rank">Offline</div>
                    </div>
                    <span class="profile-cog">⚙️</span>
                </div>
            </div>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="topbar-greeting">
                    <h1>Hey, <span id="profile-name-topbar">user</span> 👾</h1>
                    <p>// LOREM IPSUM DOLOR SIT AMET</p>
                </div>
                <div class="topbar-right">
                    <div class="notif-btn">
                        🔔
                        <span class="notif-dot" hidden></span>
                    </div>
                    <div class="xp-pill-top">
                        <span class="pill-level" id="pill-level">LV.4</span>
                        <div class="pill-divider"></div>
                        <span class="pill-xp" id="pill-xp">1,840 XP</span>
                    </div>
                </div>
            </header>
        </div>
    </div>

    <script src="../js/home.js"></script>

</body>

</html>
