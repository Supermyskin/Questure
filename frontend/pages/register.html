<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questure - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://kit.fontawesome.com/1424a6b21b.js" crossorigin="anonymous"></script>
    <script src="../js/header-handler.js"></script>
    <link rel="icon" href="../favicon.png">
</head>

<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>
    <div class="glow-blob glow-blob-3"></div>

    <div class="auth-container">
        <h2 class="auth-title">Create Account</h2>
        <form id="register-form">
            <div class="form-group">
                <input type="text" id="name_input" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="email" id="email_input" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required minlength="6">
            </div>
            <div class="form-group">
                <input type="password" id="confirm_password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn-primary btn-submit">Register</button>
        </form>
        <a href="login.html" class="auth-link">Already have an account? Login</a>
    </div>

    <script src="../js/register.js"></script>
</body>

</html>
