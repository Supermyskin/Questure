<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionture - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://kit.fontawesome.com/1424a6b21b.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>
    <div class="glow-blob glow-blob-3"></div>

    <header>
        <a href="../index.html" class="header-logo">QUESTIONTURE</a>
        <ul class="nav-links">
            <li><a href="#home"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#discover"><i class="fa-solid fa-compass"></i> Discover</a></li>
            <li><a href="#leaderboard"><i class="fa-solid fa-trophy"></i> Leaderboard</a></li>
            <li><a href="#myquests"><i class="fa-solid fa-scroll"></i> My Quests</a></li>
        </ul>
        <div style="display: flex; gap: 10px;">
            <a href="register.html" class="header-play"><i class="fa-solid fa-trophy"></i> Play now →</a>
        </div>
    </header>

    <div class="auth-container">
        <h2 class="auth-title">Welcome Back</h2>
        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email_input" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary btn-submit">Login</button>
        </form>
        <a href="register.html" class="auth-link">Don't have an account? Register</a>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
