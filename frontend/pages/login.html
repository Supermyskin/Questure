<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questure - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://kit.fontawesome.com/1424a6b21b.js" crossorigin="anonymous"></script>
    <script src="../js/header-handler.js"></script>
    <link rel="icon" href="../favicon.png">

</head>

<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>
    <div class="glow-blob glow-blob-3"></div>

    <div class="auth-container">
        <h2 class="auth-title">Welcome Back <i class="fa-solid fa-hand"></i></h2>
        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email_input" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary btn-submit">Login</button>
        </form>
        <a href="register.html" class="auth-link">Don't have an account? Register</a>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
